name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Run tests before releasing
        run: go test ./... -race
      - uses: cli/gh-extension-precompile@v2
        with:
          go_version: "1.26"
